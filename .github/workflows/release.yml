name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target\release\tommys-tracer.exe package\
          Copy-Item release\README.txt package\
          Compress-Archive -Path package\* -DestinationPath tommys-tracer-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: tommys-tracer-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: Package macOS universal app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/tommys-tracer \
            target/x86_64-apple-darwin/release/tommys-tracer \
            -output universal/tommys-tracer
      - name: Build bundled LGPL FFmpeg tools
        env:
          FFMPEG_VERSION: 7.1.1
        run: |
          SOURCE_ARCHIVE="$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION.tar.xz"
          SOURCE_DIR="$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          curl --fail --location --retry 3 \
            "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz" \
            --output "$SOURCE_ARCHIVE"
          tar -xf "$SOURCE_ARCHIVE" -C "$RUNNER_TEMP"

          build_arch() {
            local ffmpeg_arch="$1"
            local compiler_arch="$2"
            local prefix="$3"
            cd "$SOURCE_DIR"
            make distclean >/dev/null 2>&1 || true
            ./configure \
              --prefix="$prefix" \
              --arch="$ffmpeg_arch" \
              --target-os=darwin \
              --enable-cross-compile \
              --cc="clang -arch $compiler_arch" \
              --sysroot="$SDKROOT" \
              --extra-cflags="-arch $compiler_arch -mmacosx-version-min=11.0" \
              --extra-ldflags="-arch $compiler_arch -mmacosx-version-min=11.0" \
              --disable-gpl \
              --disable-nonfree \
              --disable-autodetect \
              --disable-x86asm \
              --enable-zlib \
              --enable-decoder=png \
              --enable-videotoolbox \
              --enable-audiotoolbox \
              --enable-static \
              --disable-shared \
              --disable-debug \
              --disable-doc
            make -j"$(sysctl -n hw.ncpu)"
            make install
          }

          build_arch aarch64 arm64 "$RUNNER_TEMP/ffmpeg-arm64"
          build_arch x86_64 x86_64 "$RUNNER_TEMP/ffmpeg-x86_64"
          cd "$GITHUB_WORKSPACE"
          mkdir -p bundled-ffmpeg
          for tool in ffmpeg ffprobe; do
            lipo -create \
              "$RUNNER_TEMP/ffmpeg-arm64/bin/$tool" \
              "$RUNNER_TEMP/ffmpeg-x86_64/bin/$tool" \
              -output "bundled-ffmpeg/$tool"
            strip -x "bundled-ffmpeg/$tool"
            chmod 755 "bundled-ffmpeg/$tool"
            lipo "bundled-ffmpeg/$tool" -verify_arch arm64 x86_64
          done
          bundled-ffmpeg/ffmpeg -hide_banner -encoders | grep -q h264_videotoolbox
          if ! bundled-ffmpeg/ffmpeg -hide_banner -decoders | grep -Eq '[[:space:]]png[[:space:]]'; then
            echo "PNG decoder is required to composite tracer frames." >&2
            exit 1
          fi
          if bundled-ffmpeg/ffmpeg -hide_banner -encoders | grep -q libx264; then
            echo "GPL libx264 encoder must not be present in the LGPL bundle." >&2
            exit 1
          fi
          cp "$SOURCE_ARCHIVE" "ffmpeg-$FFMPEG_VERSION.tar.xz"
          cp "$SOURCE_DIR/COPYING.LGPLv2.1" bundled-ffmpeg/FFmpeg-LGPLv2.1.txt
      - name: Package app
        run: |
          APP="Tommy's Tracer.app"
          CONTENTS="$APP/Contents"
          ICONSET="$RUNNER_TEMP/TommyTracer.iconset"
          VERSION="${RELEASE_REF#v}"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources" "$ICONSET"
          cp universal/tommys-tracer "$CONTENTS/MacOS/tommys-tracer"
          cp bundled-ffmpeg/ffmpeg bundled-ffmpeg/ffprobe "$CONTENTS/MacOS/"
          cp bundled-ffmpeg/FFmpeg-LGPLv2.1.txt "$CONTENTS/Resources/"
          cp release/README.txt "$CONTENTS/Resources/README.txt"
          cp release/FFMPEG-NOTICE.txt "$CONTENTS/Resources/"

          ICON_SOURCE="assets/branding/app_icon_small_variant.png"
          make_icon_size() {
            sips -z "$1" "$1" "$ICON_SOURCE" --out "$ICONSET/icon_${1}x${1}.png" >/dev/null
          }
          make_icon_size 16
          make_icon_size 32
          cp "$ICONSET/icon_32x32.png" "$ICONSET/icon_16x16@2x.png"
          make_icon_size 64
          cp "$ICONSET/icon_64x64.png" "$ICONSET/icon_32x32@2x.png"
          make_icon_size 128
          make_icon_size 256
          cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png"
          make_icon_size 512
          cp "$ICONSET/icon_512x512.png" "$ICONSET/icon_256x256@2x.png"
          make_icon_size 1024
          cp "$ICONSET/icon_1024x1024.png" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$CONTENTS/Resources/TommyTracer.icns"

          cat > "$CONTENTS/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>tommys-tracer</string>
            <key>CFBundleIdentifier</key>
            <string>com.tommys.tracer</string>
            <key>CFBundleName</key>
            <string>Tommy's Tracer</string>
            <key>CFBundleDisplayName</key>
            <string>Tommy'sTracer - Easy Golf Tracer</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>TommyTracer</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          printf 'APPL????' > "$CONTENTS/PkgInfo"
          ditto -c -k --sequesterRsrc --keepParent "$APP" tommys-tracer-macos-universal.zip
        env:
          RELEASE_REF: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            tommys-tracer-macos-universal.zip
            ffmpeg-7.1.1.tar.xz
          if-no-files-found: error

  linux:
    name: Package Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libgl1-mesa-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev pkg-config
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p package
          cp target/release/tommys-tracer package/
          cp release/README.txt package/
          tar -czf tommys-tracer-linux-x86_64.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: tommys-tracer-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "Tommy's Tracer $RELEASE_TAG" \
            --generate-notes
