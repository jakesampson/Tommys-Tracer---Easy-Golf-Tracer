[package]
name = "open-tracer-pc"
version = "0.1.0"
edition = "2021"
description = "A desktop golf video editor for trimming footage and creating animated shot tracers"
license = "MIT"

[dependencies]
eframe = "0.31"
image = "0.25"
imageproc = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
